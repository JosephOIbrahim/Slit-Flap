<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>DEPARTURES</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://db.onlinewebfonts.com/c/3284c3a32cf946466fb963369b3c5b2d?family=Disket+Mono" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #141414; font-family: 'JetBrains Mono', monospace; overflow-x: hidden; }
  @keyframes arrive { 0% { opacity:0; transform:perspective(600px) rotateX(-50deg) translateY(-6px) } 70% { opacity:1; transform:perspective(600px) rotateX(2deg) } 100% { opacity:1; transform:perspective(600px) rotateX(0) } }
  .arrive { animation: arrive 0.45s cubic-bezier(0.22,1,0.36,1) both; transform-origin: top center; }
  @keyframes flapFlip { 0% { transform: perspective(200px) rotateX(-60deg); opacity:0.3; } 50% { transform: perspective(200px) rotateX(8deg); opacity:1; } 100% { transform: perspective(200px) rotateX(0); opacity:1; } }
</style>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ─── API Layer ───────────────────────────────────────────────
const api = {
  async projects() { return fetch('/api/projects').then(r => r.json()); },
  async create(data) { return fetch('/api/projects', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data) }).then(r => r.json()); },
  async update(id, data) { return fetch(`/api/projects/${id}`, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data) }).then(r => r.json()); },
  async remove(id) { return fetch(`/api/projects/${id}`, { method: 'DELETE' }).then(r => r.json()); },
  async log(id, text) { return fetch(`/api/projects/${id}/log`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({text}) }).then(r => r.json()); },
  async recap() { return fetch('/api/recap').then(r => r.json()); },
  async session() { return fetch('/api/session').then(r => r.json()); },
};

// ─── Constants ───────────────────────────────────────────────
const ACCENT = "#d4a012";
const WHITE = "#e8e4de";
const FAINT = "#2a2a2a";
const BG = "#141414";
const DISPLAY = "'Disket Mono', monospace";
const MONO = "'JetBrains Mono', monospace";
const STATUSES = ["QUEUED","ACTIVE","ROLLING","BLOCKED","REVIEW","SHIPPED"];
const DOMAINS = ["VFX","AI","WEB","MIX","OPS","FAM"];
const TRACKS = ["01","02","03","04","05"];

const sys = (size, color="#555", extra={}) => ({ fontFamily:MONO, fontSize:size, color, letterSpacing:"0.04em", lineHeight:1.2, ...extra });

function statusColor(s) {
  if (s==="ACTIVE"||s==="ROLLING") return ACCENT;
  if (s==="BLOCKED") return "#b04040";
  if (s==="SHIPPED") return "#444";
  return "#3a3a3a";
}

function relTime(iso) {
  if (!iso) return "";
  const mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 1) return "now";
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  const days = Math.floor(hrs / 24);
  return days === 1 ? "1d ago" : `${days}d ago`;
}

function sessionColor(mins) {
  if (mins < 120) return "#3a5a3a";
  if (mins < 240) return "#5a4a2a";
  return "#4a2a2a";
}

function formatDuration(mins) {
  const h = Math.floor(mins / 60), m = mins % 60;
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

const inp = { background:"#111", border:"1px solid #252525", color:WHITE, fontFamily:MONO, fontSize:"11px", padding:"7px 10px", letterSpacing:"0.02em", outline:"none", width:"100%", boxSizing:"border-box", borderRadius:"2px" };
const SWATCHES = ["","#1a1714","#1a1318","#141a18","#18141a","#1a1910","#101820","#201414","#142014","#141420","#251a12","#121a25","#1a1225"];

// ─── Split Flap ──────────────────────────────────────────────
function FlapChar({ char, size=104, dim, flipping, delay=0 }) {
  const w = size * 0.7, h = size * 1.08;
  return (
    <div style={{ width:w, height:h, background: dim?"#131313":"#171717", borderRadius:"2px", display:"flex", alignItems:"center", justifyContent:"center", position:"relative", overflow:"hidden", flexShrink:0, boxShadow: dim?"none":"inset 0 1px 1px rgba(0,0,0,0.3), 0 1px 3px rgba(0,0,0,0.3)", animation: flipping?`flapFlip 0.3s cubic-bezier(0.22,1,0.36,1) both`:"none", animationDelay: flipping?`${delay}ms`:"0ms" }}>
      <span style={{ fontFamily:DISPLAY, fontSize:size, fontWeight:400, color: dim?"#1e1e1e":"#c8c4bc", lineHeight:1, position:"relative", zIndex:1, WebkitTextStroke: dim?"0":`1px #c8c4bc` }}>
        {char===" "?"\u00A0":char}
      </span>
      <div style={{ position:"absolute", top:"50%", left:0, right:0, height:"3px", transform:"translateY(-1.5px)", zIndex:2, background: dim?"#0e0e0e":"#0c0c0c", boxShadow:"0 1px 0 rgba(255,255,255,0.02), 0 -1px 0 rgba(0,0,0,0.5)" }} />
      <div style={{ position:"absolute", top:0, left:0, right:0, height:"50%", background:"linear-gradient(180deg, rgba(255,255,255,0.015) 0%, transparent 100%)", zIndex:3, pointerEvents:"none" }} />
    </div>
  );
}

function SplitFlapName({ text, shipped, flipping, size=104, align="left" }) {
  const justifyMap = { left:"flex-start", center:"center", right:"flex-end" };
  return (
    <div style={{ display:"flex", gap:"3px", overflow:"hidden", padding:"4px 0", justifyContent:justifyMap[align]||"flex-start" }}>
      {(text||"").toUpperCase().split("").map((ch,i) => <FlapChar key={i} char={ch} size={size} dim={shipped} flipping={flipping} delay={i*30} />)}
    </div>
  );
}

function Progress({ mile, of: total }) {
  if (!total) return null;
  const pct = Math.round((mile/total)*100);
  return (
    <div style={{ display:"flex", alignItems:"center", gap:"8px" }}>
      <div style={{ width:"48px", height:"2px", background:FAINT, borderRadius:"1px", overflow:"hidden" }}>
        <div style={{ width:`${pct}%`, height:"100%", background: pct>=100?"#5a8a5a":ACCENT, transition:"width 0.6s ease" }} />
      </div>
      <span style={sys("8px","#3a3a3a")}>{mile}/{total}</span>
    </div>
  );
}

// ─── Panels ──────────────────────────────────────────────────
function EditPanel({ project, onUpdate, onDelete }) {
  const u = (k,v) => onUpdate({...project,[k]:v});
  return (
    <div style={{ padding:"16px 24px 20px", borderTop:`1px solid ${FAINT}`, background:"#111" }} onClick={e=>e.stopPropagation()}>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"8px", marginBottom:"10px" }}>
        <input value={project.name} onChange={e=>u("name",e.target.value)} placeholder="PROJECT" style={inp} />
        <input value={project.next||project.nextAction||""} onChange={e=>u("nextAction",e.target.value)} placeholder="NEXT ACTION" style={inp} />
      </div>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr 1fr", gap:"8px", marginBottom:"14px" }}>
        <select value={project.domain} onChange={e=>u("domain",e.target.value)} style={inp}>{DOMAINS.map(d=><option key={d} value={d}>{d}</option>)}</select>
        <select value={project.track} onChange={e=>u("track",e.target.value)} style={inp}>{TRACKS.map(t=><option key={t} value={t}>TRK {t}</option>)}</select>
        <input type="date" value={project.deadline||""} onChange={e=>u("deadline",e.target.value)} style={inp} />
        <div style={{ display:"flex", gap:"4px" }}>
          <input type="number" min="0" value={project.mile||0} onChange={e=>u("mile",+e.target.value||0)} placeholder="MI" style={{...inp,width:"50%"}} />
          <input type="number" min="0" value={project.of||0} onChange={e=>u("of",+e.target.value||0)} placeholder="OF" style={{...inp,width:"50%"}} />
        </div>
      </div>
      <div style={{ display:"flex", gap:"3px", alignItems:"center", marginBottom:"14px" }}>
        <span style={sys("7px","#333",{letterSpacing:"0.1em",marginRight:"6px"})}>BG</span>
        {SWATCHES.map((c,i)=><button key={i} onClick={()=>u("bgColor",c)} style={{ width:"18px", height:"18px", borderRadius:"2px", border: project.bgColor===c?`1px solid ${ACCENT}`:c?"1px solid #222":"1px dashed #2a2a2a", background:c||"transparent", cursor:"pointer", padding:0 }} />)}
        <input type="color" value={project.bgColor||"#191919"} onChange={e=>u("bgColor",e.target.value)} style={{ width:"18px", height:"18px", border:"none", background:"none", cursor:"pointer", padding:0, marginLeft:"4px" }} />
      </div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
        <span style={sys("8px","#252525")}>/{project.id}</span>
        <button onClick={()=>onDelete(project.id)} style={{...sys("8px","#333"), background:"transparent", border:"1px solid #222", padding:"4px 12px", cursor:"pointer", borderRadius:"2px" }}
          onMouseEnter={e=>{e.currentTarget.style.borderColor="#b04040";e.currentTarget.style.color="#b04040"}}
          onMouseLeave={e=>{e.currentTarget.style.borderColor="#222";e.currentTarget.style.color="#333"}}>ARCHIVE</button>
      </div>
    </div>
  );
}

function LogPanel({ projectId, log }) {
  const [text, setText] = useState("");
  const [entries, setEntries] = useState(log || []);
  const addEntry = async () => {
    if (!text.trim()) return;
    await api.log(projectId, text);
    setEntries(prev => [{text, at: new Date().toISOString()}, ...prev]);
    setText("");
  };
  return (
    <div style={{ padding:"0 24px 16px", background:"#111" }} onClick={e=>e.stopPropagation()}>
      <div style={{ display:"flex", gap:"6px", marginBottom:"8px" }}>
        <input value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addEntry()}} placeholder="Log a note..." style={{...inp,flex:1}} />
        <button onClick={addEntry} style={{...inp,width:"auto",cursor:"pointer",color:ACCENT,padding:"7px 14px"}}>+</button>
      </div>
      {entries.length > 0 && <div style={{ maxHeight:"120px", overflowY:"auto" }}>
        {entries.slice(0,8).map((entry,i) => <div key={i} style={{ display:"flex", gap:"10px", padding:"3px 0" }}>
          <span style={sys("7px","#333",{minWidth:"36px",flexShrink:0})}>{relTime(entry.at)}</span>
          <span style={sys("8px","#444")}>{entry.text}</span>
        </div>)}
      </div>}
    </div>
  );
}

function RecapPanel({ onClose, sessionMins }) {
  const [data, setData] = useState(null);
  useEffect(() => { api.recap().then(setData); }, []);
  if (!data) return null;
  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.85)", zIndex:200, display:"flex", alignItems:"center", justifyContent:"center", padding:"24px" }} onClick={onClose}>
      <div style={{ background:"#161616", borderRadius:"8px", padding:"32px", maxWidth:"480px", width:"100%", border:`1px solid ${FAINT}` }} onClick={e=>e.stopPropagation()}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"20px" }}>
          <span style={{ fontFamily:DISPLAY, fontSize:"14px", color:WHITE, letterSpacing:"0.1em", textTransform:"uppercase" }}>Daily Recap</span>
          <button onClick={onClose} style={{ background:"transparent", border:"none", color:"#444", fontSize:"18px", cursor:"pointer" }}>×</button>
        </div>
        <div style={{ display:"flex", gap:"24px", marginBottom:"20px" }}>
          <div><div style={sys("24px",WHITE,{fontWeight:700,fontFamily:DISPLAY})}>{data.projectsTouched}</div><div style={sys("7px","#444",{letterSpacing:"0.1em",marginTop:"2px"})}>TOUCHED</div></div>
          <div><div style={sys("24px",ACCENT,{fontWeight:700,fontFamily:DISPLAY})}>{formatDuration(data.sessionMinutes||sessionMins)}</div><div style={sys("7px","#444",{letterSpacing:"0.1em",marginTop:"2px"})}>SESSION</div></div>
          <div><div style={sys("24px","#5a8a5a",{fontWeight:700,fontFamily:DISPLAY})}>{data.logEntries}</div><div style={sys("7px","#444",{letterSpacing:"0.1em",marginTop:"2px"})}>LOGS</div></div>
        </div>
        {data.projects?.length > 0 && <div style={{ borderTop:`1px solid ${FAINT}`, paddingTop:"14px" }}>
          {data.projects.map(p => <div key={p.id} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"6px 0" }}>
            <span style={sys("10px",WHITE)}>{p.name}</span>
            <span style={sys("8px",statusColor(p.status))}>{p.status}</span>
          </div>)}
        </div>}
      </div>
    </div>
  );
}

// ─── Event / Email Rows (mock for now) ───────────────────────
const MOCK_EVENTS = [
  {id:"ev1",time:"09:00",end:"09:30",name:"Morning standup"},
  {id:"ev2",time:"11:30",end:"12:00",name:"Dylan basketball pickup"},
  {id:"ev3",time:"13:00",end:"13:30",name:"Lunch — skip if deep in flow"},
  {id:"ev4",time:"15:00",end:"15:30",name:"Patent attorney call",linkedProject:"patents"},
  {id:"ev5",time:"17:30",end:"18:00",name:"Dog walk + debrief"},
];
const MOCK_EMAILS = [
  {id:"em1",time:"08:15",from:"USPTO",subject:"Patent filing confirmation",linkedProject:"patents"},
  {id:"em2",time:"09:45",from:"Vercel",subject:"Deploy succeeded: jaimeibrahim.com",linkedProject:"jaime"},
  {id:"em3",time:"12:20",from:"GitHub",subject:"New issue on Harlo: decay test flaky",linkedProject:"cog-sub"},
];

function EventRow({ event }) {
  return (
    <div style={{ background:"#161616", borderRadius:"6px", padding:"14px 24px", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
      <div style={{ display:"flex", alignItems:"center", gap:"16px", flex:1, minWidth:0 }}>
        <span style={sys("10px",ACCENT,{fontWeight:700,minWidth:"40px"})}>{event.time}</span>
        <span style={{ fontFamily:MONO, fontSize:"13px", fontWeight:500, color:"#999", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{event.name}</span>
      </div>
      <div style={{ display:"flex", alignItems:"center", gap:"12px", flexShrink:0 }}>
        {event.linkedProject && <span style={sys("7px","#333",{letterSpacing:"0.08em"})}>→ {event.linkedProject}</span>}
        <span style={sys("7px","#222")}>{event.end}</span>
      </div>
    </div>
  );
}

function EmailRow({ email }) {
  return (
    <div style={{ padding:"8px 24px", display:"flex", alignItems:"center", justifyContent:"space-between", borderLeft:`2px solid ${email.linkedProject?"#2a2520":"#1a1a1a"}`, marginLeft:"12px" }}>
      <div style={{ display:"flex", alignItems:"center", gap:"12px", flex:1, minWidth:0 }}>
        <span style={sys("8px","#333",{minWidth:"36px"})}>{email.time}</span>
        <span style={sys("8px","#444",{fontWeight:600})}>{email.from}</span>
        <span style={sys("8px","#2e2e2e",{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1})}>{email.subject}</span>
      </div>
      {email.linkedProject && <span style={sys("7px","#252525")}>→ {email.linkedProject}</span>}
    </div>
  );
}

function NowLine() {
  const [now, setNow] = useState(new Date());
  useEffect(() => { const t = setInterval(()=>setNow(new Date()), 60000); return ()=>clearInterval(t); }, []);
  return (
    <div style={{ display:"flex", alignItems:"center", gap:"12px", padding:"4px 24px", margin:"2px 0" }}>
      <span style={sys("8px",ACCENT,{fontWeight:700})}>NOW {now.getHours().toString().padStart(2,"0")}:{now.getMinutes().toString().padStart(2,"0")}</span>
      <div style={{ flex:1, height:"1px", background:`linear-gradient(to right, ${ACCENT}, transparent)` }} />
    </div>
  );
}

// ─── Project Row ─────────────────────────────────────────────
function ProjectRow({ project, onUpdate, onDelete, open, onToggle, showTime, isNextUp, flapSize=104, flapAlign="left" }) {
  const shipped = project.status === "SHIPPED";
  const [flipping, setFlipping] = useState(false);
  const triggerFlip = () => { setFlipping(true); setTimeout(()=>setFlipping(false), 400); };

  const cycleStatus = (e) => {
    e.stopPropagation();
    const i = STATUSES.indexOf(project.status);
    const next = STATUSES[(i+1)%STATUSES.length];
    triggerFlip();
    onUpdate({...project, status:next});
  };

  const handleToggle = () => { if(!open) triggerFlip(); onToggle(); };
  const next = project.next || project.nextAction || "";

  return (
    <div style={{ background:project.bgColor||"#1a1a1a", borderRadius:"6px", cursor:"pointer", transition:"all 0.35s cubic-bezier(0.22,1,0.36,1)", position:"relative", zIndex:1, overflow:"hidden", borderLeft: isNextUp?`3px solid ${ACCENT}`:"3px solid transparent" }}
      onClick={handleToggle}
      onMouseEnter={e=>{if(!shipped){e.currentTarget.style.transform="scale(1.015) translateY(-3px)";e.currentTarget.style.boxShadow=`0 8px 40px rgba(0,0,0,0.5)`;e.currentTarget.style.zIndex="10";e.currentTarget.style.background=project.bgColor||"#202020"}}}
      onMouseLeave={e=>{e.currentTarget.style.transform="scale(1)";e.currentTarget.style.boxShadow="none";e.currentTarget.style.zIndex="1";e.currentTarget.style.background=project.bgColor||"#1a1a1a"}}>
      {isNextUp && <div style={{padding:"6px 24px 0",display:"flex",alignItems:"center",gap:"8px"}}><span style={sys("7px",ACCENT,{fontWeight:700,letterSpacing:"0.14em"})}>NEXT UP</span><div style={{flex:1,height:"1px",background:"#2a2520"}} /></div>}
      <div style={{ padding: isNextUp?"10px 24px 20px":"20px 24px", minHeight:"180px", display:"flex", flexDirection:"column", justifyContent:"space-between", opacity:shipped?0.3:1 }}>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
          <div style={{ display:"flex", alignItems:"center", gap:"16px" }}>
            {showTime && project.todayTime ? <span style={sys("10px",ACCENT,{fontWeight:700})}>{project.todayTime}</span> : <span style={sys("10px","#333")}>{project.track}</span>}
            <span style={sys("9px","#2a2a2a",{letterSpacing:"0.08em"})}>{project.domain}</span>
            <span style={sys("8px","#222")}>{relTime(project.lastTouched)}</span>
          </div>
          <button onClick={cycleStatus} style={{ background:"transparent", border:"none", fontFamily:MONO, fontSize:"9px", fontWeight:600, color:statusColor(project.status), letterSpacing:"0.1em", cursor:"pointer" }}>{project.status}</button>
        </div>
        <div style={{padding:"4px 0"}}><SplitFlapName text={project.name} shipped={shipped} flipping={flipping} size={flapSize} align={flapAlign} /></div>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", minHeight:"12px" }}>
          {next ? <span style={sys("9px","#3a3a3a",{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"})}>{next}</span> : <span />}
          {(project.of||0) > 0 && <Progress mile={project.mile} of={project.of} />}
        </div>
      </div>
      {open && <><EditPanel project={project} onUpdate={onUpdate} onDelete={onDelete} /><LogPanel projectId={project.id} log={project.log||[]} /></>}
    </div>
  );
}

// ─── Main App ────────────────────────────────────────────────
function Departures() {
  const [projects, setProjects] = useState([]);
  const [openId, setOpenId] = useState(null);
  const [filter, setFilter] = useState("TODAY");
  const [ready, setReady] = useState(false);
  const [interval, setInterval_] = useState(0.12);
  const [animKey, setAnimKey] = useState(0);
  const [showRecap, setShowRecap] = useState(false);
  const [sessionMins, setSessionMins] = useState(0);
  const [flapSize, setFlapSize] = useState(104);
  const [flapAlign, setFlapAlign] = useState("left");
  const prevFilter = useRef(filter);

  // Load projects from API
  const loadProjects = async () => {
    const data = await api.projects();
    setProjects(data);
    if (!ready) setReady(true);
  };

  useEffect(() => { loadProjects(); }, []);

  // Session polling
  useEffect(() => {
    const t = setInterval(async () => {
      try { const s = await api.session(); setSessionMins(s.elapsedMinutes); } catch(e) {}
    }, 30000);
    api.session().then(s => setSessionMins(s.elapsedMinutes));
    return () => clearInterval(t);
  }, []);

  // Animation triggers
  useEffect(() => { if (prevFilter.current !== filter) { setAnimKey(k=>k+1); prevFilter.current = filter; } }, [filter]);
  useEffect(() => { if (ready) setAnimKey(k=>k+1); }, [ready]);

  const add = async () => {
    const result = await api.create({ name: "New Project" });
    await loadProjects();
    setOpenId(result.id);
  };

  const update = async (p) => {
    await api.update(p.id, p);
    await loadProjects();
  };

  const remove = async (id) => {
    await api.remove(id);
    setProjects(prev => prev.filter(x => x.id !== id));
    if (openId === id) setOpenId(null);
  };

  const isToday = filter === "TODAY";
  const filtered = isToday
    ? projects.filter(p => p.status !== "SHIPPED" && p.todayTime)
    : projects.filter(p => filter === "ALL" ? p.status !== "SHIPPED" : p.status === filter);

  // Timeline
  const timeToMins = t => { if(!t) return 9999; const [h,m] = t.split(":").map(Number); return h*60+m; };
  const todayTimeline = (() => {
    if (!isToday) return [];
    const items = [];
    filtered.forEach(p => items.push({type:"project",data:p,sk:timeToMins(p.todayTime)}));
    MOCK_EVENTS.forEach(ev => items.push({type:"event",data:ev,sk:timeToMins(ev.time)}));
    MOCK_EMAILS.forEach(em => items.push({type:"email",data:em,sk:timeToMins(em.time)}));
    items.sort((a,b) => a.sk - b.sk);
    const nowMins = new Date().getHours()*60 + new Date().getMinutes();
    let inserted = false;
    const result = [];
    for (const item of items) { if (!inserted && item.sk >= nowMins) { result.push({type:"now"}); inserted = true; } result.push(item); }
    if (!inserted) result.push({type:"now"});
    return result;
  })();

  const unscheduled = isToday ? projects.filter(p => p.status!=="SHIPPED" && p.status!=="QUEUED" && !p.todayTime) : [];

  // Clock
  const [now, setNow] = useState(new Date());
  useEffect(() => { const t = setInterval(()=>setNow(new Date()), 1000); return ()=>clearInterval(t); }, []);
  const time = now.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",hour12:false});
  const date = now.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}).toUpperCase();

  const intervals = [0.06, 0.12, 0.25, 0.5, 1.0];
  const filters = ["ALL","TODAY","ACTIVE","ROLLING","BLOCKED","QUEUED","SHIPPED"];

  if (!ready) return <div style={{background:BG,color:"#222",height:"100vh",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:MONO,fontSize:"11px",letterSpacing:"0.15em"}}>LOADING</div>;

  return (
    <div style={{background:BG,minHeight:"100vh",fontFamily:MONO}}>
      {/* Header */}
      <div style={{padding:"20px 24px 12px",borderBottom:`1px solid ${FAINT}`}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div>
            <h1 style={{fontFamily:DISPLAY,fontSize:"16px",fontWeight:400,color:WHITE,letterSpacing:"0.1em",margin:0,lineHeight:1,textTransform:"uppercase"}}>{isToday?"Today":"Departures"}</h1>
            <div style={{display:"flex",alignItems:"center",gap:"8px",marginTop:"4px"}}>
              <div style={sys("7px","#252525",{letterSpacing:"0.12em"})}>{isToday?date:"USD-COMPOSED PROJECT STATE"}</div>
              <div style={{display:"flex",alignItems:"center",gap:"5px"}}><div style={{width:"5px",height:"5px",borderRadius:"50%",background:sessionColor(sessionMins),transition:"background 2s"}} /><span style={sys("7px","#333")}>{formatDuration(sessionMins)}</span></div>
            </div>
          </div>
          <div style={{display:"flex",alignItems:"flex-start",gap:"16px"}}>
            {/* Font size & alignment controls */}
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:"4px",marginTop:"2px"}}>
              <div style={{display:"flex",gap:"0px"}}>
                <button onClick={()=>setFlapSize(s=>Math.max(32,s-8))} style={{background:"transparent",border:`1px solid #222`,borderRadius:"2px 0 0 2px",fontFamily:MONO,fontSize:"9px",fontWeight:700,color:"#444",cursor:"pointer",padding:"2px 7px",lineHeight:1}}
                  onMouseEnter={e=>{e.currentTarget.style.borderColor=ACCENT;e.currentTarget.style.color=ACCENT}} onMouseLeave={e=>{e.currentTarget.style.borderColor="#222";e.currentTarget.style.color="#444"}}>−</button>
                <button onClick={()=>setFlapSize(s=>Math.min(160,s+8))} style={{background:"transparent",border:`1px solid #222`,borderLeft:"none",borderRadius:"0 2px 2px 0",fontFamily:MONO,fontSize:"9px",fontWeight:700,color:"#444",cursor:"pointer",padding:"2px 7px",lineHeight:1}}
                  onMouseEnter={e=>{e.currentTarget.style.borderColor=ACCENT;e.currentTarget.style.color=ACCENT}} onMouseLeave={e=>{e.currentTarget.style.borderColor="#222";e.currentTarget.style.color="#444"}}>+</button>
              </div>
              <div style={{display:"flex",gap:"0px"}}>
                {[["left","L"],["center","C"],["right","R"]].map(([val,label])=><button key={val} onClick={()=>setFlapAlign(val)} style={{background:"transparent",border:`1px solid ${flapAlign===val?"#333":"#222"}`,borderLeft:val!=="left"?"none":undefined,borderRadius:val==="left"?"2px 0 0 2px":val==="right"?"0 2px 2px 0":"0",fontFamily:MONO,fontSize:"7px",fontWeight:flapAlign===val?700:400,color:flapAlign===val?ACCENT:"#333",cursor:"pointer",padding:"2px 6px",lineHeight:1}}>{label}</button>)}
              </div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontFamily:MONO,fontSize:"18px",fontWeight:800,color:ACCENT,letterSpacing:"0.06em",lineHeight:1,fontVariantNumeric:"tabular-nums"}}>{time}</div>
              <div style={sys("8px","#3a3a3a",{marginTop:"3px",letterSpacing:"0.06em"})}>{date}</div>
              <div style={{display:"flex",gap:"0px",marginTop:"5px",justifyContent:"flex-end"}}>
                {intervals.map(v=><button key={v} onClick={()=>setInterval_(v)} style={{background:"transparent",border:"none",fontFamily:MONO,fontSize:"6px",color:interval===v?ACCENT:"#1e1e1e",cursor:"pointer",padding:"1px 3px",lineHeight:1}}>{v<1?`.${String(v).split(".")[1]}`:"1s"}</button>)}
              </div>
            </div>
          </div>
        </div>
      </div>

      {/* Filters */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"6px 24px",borderBottom:`1px solid ${FAINT}`}}>
        <div style={{display:"flex"}}>{filters.map(f=><button key={f} onClick={()=>setFilter(f)} style={{background:"transparent",border:"none",fontFamily:MONO,fontSize:"8px",fontWeight:filter===f?700:400,color:filter===f?(f==="TODAY"?ACCENT:WHITE):"#2a2a2a",letterSpacing:"0.1em",padding:"4px 10px",cursor:"pointer"}}>{f}</button>)}</div>
        <span style={sys("8px","#222")}>{isToday?todayTimeline.filter(t=>t.type!=="now").length:filtered.length}</span>
      </div>

      {/* Board */}
      <div style={{perspective:"800px",display:"flex",flexDirection:"column",gap:"18px",padding:"18px 0"}}>
        {isToday ? <>
          {todayTimeline.map((item,i) => {
            if (item.type==="now") return <NowLine key="now" />;
            if (item.type==="event") return <div key={item.data.id} className="arrive" style={{animationDelay:`${i*interval}s`,padding:"0 12px"}}><EventRow event={item.data} /></div>;
            if (item.type==="email") return <div key={item.data.id} className="arrive" style={{animationDelay:`${i*interval}s`,padding:"0 12px"}}><EmailRow email={item.data} /></div>;
            if (item.type==="project") return <div key={`${item.data.id}-${animKey}`} className="arrive" style={{animationDelay:`${i*interval}s`,padding:"0 12px"}}><ProjectRow project={item.data} onUpdate={update} onDelete={remove} open={openId===item.data.id} onToggle={()=>setOpenId(openId===item.data.id?null:item.data.id)} showTime isNextUp={item.data.isNextUp} flapSize={flapSize} flapAlign={flapAlign} /></div>;
            return null;
          })}
          {unscheduled.length>0 && <>
            <div style={{padding:"12px 24px 4px"}}><span style={sys("7px","#252525",{letterSpacing:"0.14em",textTransform:"uppercase"})}>No time blocked</span></div>
            {unscheduled.map((p,i) => <div key={`${p.id}-${animKey}`} className="arrive" style={{animationDelay:`${(todayTimeline.length+i)*interval}s`,padding:"0 12px"}}><ProjectRow project={p} onUpdate={update} onDelete={remove} open={openId===p.id} onToggle={()=>setOpenId(openId===p.id?null:p.id)} showTime={false} isNextUp={p.isNextUp} flapSize={flapSize} flapAlign={flapAlign} /></div>)}
          </>}
        </> : <>
          {filtered.map((p,i) => <div key={`${p.id}-${animKey}`} className="arrive" style={{animationDelay:`${i*interval}s`,padding:"0 12px"}}><ProjectRow project={p} onUpdate={update} onDelete={remove} open={openId===p.id} onToggle={()=>setOpenId(openId===p.id?null:p.id)} showTime={false} isNextUp={p.isNextUp} flapSize={flapSize} flapAlign={flapAlign} /></div>)}
        </>}
        {!isToday && filtered.length===0 && <div style={{padding:"60px 24px",textAlign:"center"}}><div style={sys("11px","#222",{letterSpacing:"0.12em"})}>{filter==="ALL"?"NO ACTIVE DEPARTURES":`NO ${filter} PROJECTS`}</div></div>}
      </div>

      {/* Actions */}
      <div style={{position:"fixed",bottom:"20px",right:"20px",display:"flex",gap:"8px",zIndex:50}}>
        <button onClick={()=>setShowRecap(true)} style={{width:"44px",height:"44px",borderRadius:"50%",background:"#1a1a1a",border:`1px solid ${FAINT}`,color:"#444",fontFamily:MONO,fontSize:"9px",fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}
          onMouseEnter={e=>{e.currentTarget.style.borderColor=ACCENT;e.currentTarget.style.color=ACCENT}} onMouseLeave={e=>{e.currentTarget.style.borderColor=FAINT;e.currentTarget.style.color="#444"}}>REC</button>
        <button onClick={()=>openId&&remove(openId)} style={{width:"44px",height:"44px",borderRadius:"50%",background:openId?"#252525":"#1a1a1a",border:"none",color:openId?WHITE:"#333",fontFamily:DISPLAY,fontSize:"22px",fontWeight:300,cursor:openId?"pointer":"default",display:"flex",alignItems:"center",justifyContent:"center",lineHeight:1,paddingBottom:"2px"}}
          onMouseEnter={e=>{if(openId){e.currentTarget.style.background="#b04040";e.currentTarget.style.color="#000"}}} onMouseLeave={e=>{e.currentTarget.style.background=openId?"#252525":"#1a1a1a";e.currentTarget.style.color=openId?WHITE:"#333"}}>−</button>
        <button onClick={add} style={{width:"44px",height:"44px",borderRadius:"50%",background:ACCENT,border:"none",color:"#000",fontFamily:DISPLAY,fontSize:"22px",fontWeight:500,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",lineHeight:1,paddingBottom:"2px",boxShadow:`0 4px 20px ${ACCENT}33`}}
          onMouseEnter={e=>e.currentTarget.style.transform="scale(1.06)"} onMouseLeave={e=>e.currentTarget.style.transform="scale(1)"}>+</button>
      </div>

      {showRecap && <RecapPanel onClose={()=>setShowRecap(false)} sessionMins={sessionMins} />}

      <div style={{padding:"20px 24px 72px",textAlign:"center"}}><span style={sys("7px","#1a1a1a",{letterSpacing:"0.2em"})}>DEPARTURES 0.4 · USD-COMPOSED · SOLARI PROTOCOL</span></div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Departures />);
</script>
</body>
</html>
