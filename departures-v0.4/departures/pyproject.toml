[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "departures"
version = "0.4.0"
description = "USD-Composed Project State Board — Solari Protocol"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Joseph Ibrahim"}]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "aiosqlite>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
departures = "departures.cli:main"

[tool.setuptools.packages.find]
include = ["departures*"]

[tool.setuptools.package-data]
departures = ["frontend/dist/**/*"]
